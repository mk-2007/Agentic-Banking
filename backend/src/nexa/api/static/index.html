<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexaBank Agentic Platform</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1b2333; --mute:#667085; --line:#e4e7ee; --blue:#3b73d4; --red:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#10203f; color:#fff; padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; flex:1; }
  header input { padding:6px 8px; border-radius:6px; border:0; width:260px; }
  button { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:7px 12px; cursor:pointer; }
  button.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.bad { background:var(--red); }
  button:disabled { opacity:.5; cursor:default; }
  main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px 20px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:0 0 10px; }
  .row { padding:8px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; cursor:pointer; }
  .row:hover, .row.sel { border-color:var(--blue); }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:#eef2ff; color:#27408b; margin-right:4px; }
  .pill.warn { background:#fff4e0; color:#8a5200; } .pill.ok { background:#e9f7ef; color:#1f6b40; } .pill.bad { background:#fdecea; color:#912d22; }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .mute { color:var(--mute); } .hash { font-family:monospace; font-size:11px; }
  #msg { padding:8px 20px; } #msg.err { background:#fdecea; color:#912d22; }
  select, textarea { width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>NexaBank Agentic Platform <span class="mute">agents recommend, code enforces, humans authorize</span></h1>
  <input id="token" type="password" placeholder="Bearer token (from run_api.py --demo)" autocomplete="off">
  <button id="connect">Connect</button>
</header>
<div id="msg"></div>
<main>
  <section>
    <div class="card"><h2>Open a case</h2>
      <select id="scenario"></select>
      <p id="scenarioDesc" class="mute"></p>
      <button id="open" disabled>Run investigation</button>
    </div>
    <div class="card"><h2>Waiting for approval</h2><div id="pending" class="mute">Connect first.</div></div>
    <div class="card"><h2>All cases</h2><div id="cases" class="mute">Connect first.</div></div>
  </section>
  <section id="detail"><div class="card mute">Pick or open a case.</div></section>
</main>
<script>
// Every value from the API is inserted with textContent, never as HTML.
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("nexa_token") || "";
let scenarios = [], current = null;
$("token").value = token;

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function note(text, bad) { $("msg").textContent = text || ""; $("msg").className = bad ? "err" : ""; }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : r.status + " " + r.statusText);
  return body;
}
const guard = fn => async (...a) => { try { note(""); await fn(...a); } catch (e) { note(e.message, true); } };
function pill(text, kind) { return el("span", text, "pill " + (kind || "")); }
function statusKind(s) { return /execut|approved|decision_ready|closed/.test(s) ? "ok" : /fail|reject|expire|escalat/.test(s) ? "bad" : "warn"; }

function list(box, items) {
  box.replaceChildren();
  if (!items.length) { box.append(el("span", "None.", "mute")); return; }
  for (const c of items) {
    const row = el("div", "", "row" + (current === c.id ? " sel" : ""));
    row.append(pill(c.status, statusKind(c.status)), el("span", c.id));
    if (c.recommended_action) row.append(el("div", c.recommended_action, "mute"));
    row.onclick = guard(() => show(c.id));
    box.append(row);
  }
}
async function refresh() {
  list($("cases"), await api("/cases"));
  const pend = await api("/approvals/pending");
  list($("pending"), pend.map(v => ({ id: v.id, status: v.status, recommended_action: v.decision && v.decision.recommended_action })));
}

function section(title) { const c = el("div", "", "card"); c.append(el("h2", title)); return c; }
function table(head, rows) {
  const t = el("table"), h = el("tr");
  head.forEach(x => h.append(el("th", x))); t.append(h);
  rows.forEach(r => { const tr = el("tr"); r.forEach(x => tr.append(x instanceof Node ? x : el("td", x))); t.append(tr); });
  return t;
}
async function show(id) {
  current = id;
  const v = await api("/cases/" + encodeURIComponent(id));
  const audit = await api("/cases/" + encodeURIComponent(id) + "/audit");
  const d = $("detail"); d.replaceChildren();

  const head = section("Case " + v.id);
  head.append(pill(v.status, statusKind(v.status)), el("span", v.trigger, "mute"),
    el("div", `account ${v.account_id} · transaction ${v.transaction_id}`, "mute"),
    el("div", "Path: " + v.trail.join(" → "), "mute"));
  if (v.failure) head.append(pill("failure: " + v.failure, "bad"));
  v.uncertainty_flags.forEach(f => head.append(pill(f, "warn")));
  d.append(head);

  const ev = section("Evidence (typed findings)");
  ev.append(v.findings.length ? table(["Code", "Signal", "Summary"], v.findings.map(f => [f.code, f.signal, f.summary])) : el("span", "No findings.", "mute"));
  d.append(ev);

  if (v.decision) {
    const x = v.decision, dc = section("Recommendation (advice, not action)");
    dc.append(pill(x.recommended_action, "ok"), pill("risk level " + x.risk_level), pill(x.approval_required ? "human approval required" : "no approval needed", x.approval_required ? "warn" : "ok"));
    if (x.overridden_by) dc.append(pill("gate: " + x.overridden_by, "warn"));
    dc.append(el("div", `provider: ${x.provider} · evidence strength ${x.evidence_strength} (a ranking score, not a probability)`, "mute"));
    dc.append(table(["Candidate", "Score"], x.candidates.map(c => [c.action, String(c.score)])));
    dc.append(el("div", "Policy: " + (x.policy_refs.map(r => `${r.doc_id} v${r.version}${r.section ? " §" + r.section : ""}`).join("; ") || "none"), "mute"));
    d.append(dc);
  }
  if (v.approval) d.append(approvalCard(v));

  const au = section("Audit chain (" + audit.length + " events)");
  au.append(table(["Time", "Event", "Actor", "Detail", "Hash"], audit.map(e => [e.timestamp.slice(11, 19), e.event_type, e.actor, e.detail, el("td", e.event_hash.slice(0, 10), "hash")])));
  d.append(au);
  await refresh();
}
function approvalCard(v) {
  const a = v.approval, c = section("Approval");
  c.append(pill(a.status || "pending", statusKind(a.status || "pending")), el("div", `${a.action} on ${a.target_account_id} · needs: ${a.required_roles.join(" + ")} · expires ${a.expires_at}`, "mute"));
  c.append(a.votes.length ? table(["Approver", "Role", "Verdict"], a.votes.map(x => [x.approver_id, x.role, x.verdict])) : el("div", "No votes yet.", "mute"));
  if (v.status === "awaiting_approval") {
    const box = el("textarea"); box.placeholder = "Comment (optional)"; box.maxLength = 500;
    c.append(box);
    for (const verdict of ["approve", "reject", "escalate", "modify"]) {
      const b = el("button", verdict, verdict === "reject" ? "bad" : "alt");
      b.style.marginRight = "6px"; b.style.marginTop = "6px";
      b.onclick = guard(async () => { await api(`/cases/${encodeURIComponent(v.id)}/votes`, { method: "POST", body: JSON.stringify({ verdict, comment: box.value }) }); await show(v.id); });
      c.append(b);
    }
    c.append(el("div", "You vote as the role of the token you connected with; one role voting twice does not count as two approvers.", "mute"));
  }
  return c;
}

$("connect").onclick = guard(async () => {
  token = $("token").value.trim(); sessionStorage.setItem("nexa_token", token);
  scenarios = await api("/scenarios");
  $("scenario").replaceChildren(...scenarios.map((s, i) => { const o = el("option", s.title); o.value = i; return o; }));
  $("scenario").onchange(); $("open").disabled = false;
  await refresh(); note("Connected.");
});
$("scenario").onchange = () => { const s = scenarios[$("scenario").value]; $("scenarioDesc").textContent = s ? s.description : ""; };
$("open").onclick = guard(async () => {
  const { id, title, description, ...alert } = scenarios[$("scenario").value];
  $("open").disabled = true;
  try { const v = await api("/cases", { method: "POST", body: JSON.stringify(alert) }); await show(v.id); }
  finally { $("open").disabled = false; }
});
if (token) $("connect").onclick();
</script>
</body>
</html>
