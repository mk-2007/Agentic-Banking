<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexaBank · NEXA agentic control room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317120f'/%3E%3Ccircle cx='13' cy='16' r='9' fill='%23ff5a1f'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%2300a39b' fill-opacity='.8'/%3E%3C/svg%3E">
<style>
/* Look: a riso print. Four spot inks on warm paper; where two inks overlap they multiply, so the
   blends are real overprints rather than gradients. */
:root {
  --paper:#efe5cd; --card:#f8f1df; --ink:#17120f; --mute:#6b5f52;
  --o:#ff5a1f; --t:#00a39b; --p:#ff4fa3; --y:#ffc928; --b:#2b5bd7;
  --display:Bahnschrift,"Arial Narrow","Franklin Gothic Medium",Impact,sans-serif;
  --mono:"Cascadia Mono","SF Mono",Consolas,monospace;
}
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); font:14px/1.45 "Segoe UI",system-ui,sans-serif; background:var(--paper);
  background-image:radial-gradient(circle at 100% 0,#ff5a1f33 0 18%,transparent 40%),
    radial-gradient(circle at 0 100%,#00a39b33 0 14%,transparent 38%),
    radial-gradient(circle,#17120f1f 1px,transparent 1.6px); background-size:auto,auto,7px 7px; background-attachment:fixed; }
button,input,textarea { font:inherit; color:inherit; }
.mono { font-family:var(--mono); font-size:12px; }
.mute { color:var(--mute); }

/* masthead */
.mast { display:flex; gap:24px; align-items:center; flex-wrap:wrap; padding:18px 28px 10px; }
.word { font:900 clamp(64px,10vw,118px)/.82 var(--display); letter-spacing:-.04em; position:relative; user-select:none; }
.word span { display:inline-block; mix-blend-mode:multiply; }
.word .a { color:var(--o); } .word .b { color:var(--t); margin-left:-.34em; transform:translate(.03em,.05em); }
.tag { flex:1; min-width:220px; font:700 15px/1.25 var(--display); text-transform:uppercase; letter-spacing:.04em; }
.tag b { background:var(--ink); color:var(--paper); padding:0 6px; }
.plug { display:flex; gap:8px; align-items:stretch; background:var(--card); border:2px solid var(--ink); box-shadow:5px 5px 0 var(--p); padding:6px; }
.plug input { border:0; background:transparent; width:230px; outline:0; font-family:var(--mono); }
.stamp { display:inline-block; font:800 12px var(--display); letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border:2px solid currentColor; }
.btn { cursor:pointer; background:var(--ink); color:var(--paper); border:2px solid var(--ink); padding:7px 14px;
  font:800 13px var(--display); letter-spacing:.08em; text-transform:uppercase; box-shadow:3px 3px 0 var(--c,var(--o)); transition:transform .08s,box-shadow .08s; }
.btn:hover:not(:disabled) { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--c,var(--o)); }
.btn:active:not(:disabled) { transform:translate(2px,2px); box-shadow:0 0 0 var(--c,var(--o)); }
.btn:disabled { opacity:.4; cursor:default; }
.btn.alt { background:var(--card); color:var(--ink); }

.ticker { overflow:hidden; background:var(--ink); color:var(--y); border-block:2px solid var(--ink); white-space:nowrap; }
.ticker div { display:inline-flex; animation:slide 38s linear infinite; font:800 13px/2.1 var(--display); letter-spacing:.14em; text-transform:uppercase; }
.ticker i { font-style:normal; color:var(--p); padding:0 18px; }
@keyframes slide { to { transform:translateX(-50%); } }
#msg { min-height:0; padding:0 28px; font:700 13px var(--mono); }
#msg.show { padding:8px 28px; background:var(--p); color:var(--ink); border-bottom:2px solid var(--ink); }

/* shell */
.tabs { display:flex; gap:0; padding:16px 28px 0; }
.tabs button { cursor:pointer; background:var(--paper); border:2px solid var(--ink); border-bottom:0; padding:6px 18px; font:800 14px var(--display); letter-spacing:.08em; text-transform:uppercase; margin-right:-2px; }
.tabs button.on { background:var(--ink); color:var(--y); }
main { display:grid; grid-template-columns:minmax(280px,340px) 1fr; gap:22px; padding:20px 28px 60px; border-top:2px solid var(--ink); }
@media (max-width:980px) { main { grid-template-columns:1fr; } }
.card { --c:var(--o); background:var(--card); border:2px solid var(--ink); box-shadow:7px 7px 0 var(--c); padding:16px; margin-bottom:26px; position:relative; }
.card > h2 { position:absolute; top:-13px; left:12px; margin:0; background:var(--ink); color:var(--paper); padding:1px 10px; font:800 13px/1.6 var(--display); letter-spacing:.12em; text-transform:uppercase; }
.card > h2 em { font-style:normal; color:var(--c); }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:22px; } @media (max-width:1180px) { .cols { grid-template-columns:1fr; } }

/* scenario cartridges */
.carts { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-bottom:10px; }
.cart { --c:var(--o); cursor:pointer; text-align:left; background:var(--card); border:2px solid var(--ink); padding:6px 7px 7px; min-height:74px; position:relative; overflow:hidden; font-size:12px; line-height:1.15; font-weight:600; }
.cart::before { content:""; position:absolute; inset:0 0 auto 0; height:8px; background:var(--c); border-bottom:2px solid var(--ink); }
.cart b { display:block; font:900 24px/1 var(--display); margin:10px 0 3px; color:var(--c); -webkit-text-stroke:1.5px var(--ink); }
.cart:hover { transform:rotate(-1.5deg) scale(1.04); z-index:1; } .cart.on { background:var(--c); box-shadow:4px 4px 0 var(--ink); } .cart.on b { color:var(--card); }
.row { cursor:pointer; display:flex; gap:8px; align-items:center; padding:6px 8px; border:2px solid var(--ink); margin-bottom:6px; background:var(--card); }
.row:hover { background:#fff7e0; transform:translateX(3px); } .row.sel { box-shadow:4px 4px 0 var(--ink); background:var(--y); }
.row { flex-wrap:wrap; } .row .id { font:12px var(--mono); flex:1; }
.st { --c:var(--y); color:var(--ink); background:var(--c); border:2px solid var(--ink); font:800 11px var(--display); letter-spacing:.06em; text-transform:uppercase; padding:1px 7px; white-space:nowrap; }
.st.ok { --c:var(--t); } .st.bad { --c:var(--p); } .st.wait { --c:var(--o); animation:blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { filter:saturate(.3) brightness(1.15); } }

/* relay (the agent pipeline) */
.relay { display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:0; margin:6px 0 12px; counter-reset:n; }
.node { --c:var(--t); counter-increment:n; cursor:pointer; position:relative; border:2px solid var(--ink); margin:0 -1px -1px 0; padding:22px 8px 8px; background:var(--card);
  filter:grayscale(1) opacity(.55); transition:filter .25s,background .25s,transform .25s; min-height:84px; }
.node::before { content:counter(n,decimal-leading-zero); position:absolute; top:3px; left:6px; font:800 11px var(--mono); }
.node b { display:block; font:800 14px/1.05 var(--display); text-transform:uppercase; letter-spacing:.02em; }
.node small { font-size:11px; color:var(--mute); line-height:1.1; display:block; margin-top:3px; }
.node.lit { filter:none; background:var(--c); } .node.lit small { color:var(--ink); }
.node.now { transform:translateY(-6px) rotate(-1deg); box-shadow:5px 5px 0 var(--ink); z-index:2; }
.node.skip { filter:grayscale(1) opacity(.5); background:repeating-linear-gradient(135deg,transparent 0 6px,#17120f22 6px 8px); }
.node.skip small::after { content:" · not needed"; }
.node.pick { outline:4px solid var(--ink); outline-offset:-8px; }
.ctl { display:flex; gap:10px; align-items:center; }
.ctl input[type=range] { flex:1; accent-color:var(--o); }
.read { font:12px var(--mono); min-height:18px; background:var(--ink); color:var(--y); padding:3px 8px; margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* evidence slips */
.slip { --c:var(--y); border:2px solid var(--ink); border-left:12px solid var(--c); padding:6px 9px; margin-bottom:8px; background:var(--card); }
.slip.risk { --c:var(--o); } .slip.benign, .slip.safe, .slip.low { --c:var(--t); }
.slip code { font:800 13px var(--mono); text-transform:uppercase; letter-spacing:.03em; }
.slip .sig { float:right; }
.hazard { display:inline-block; font:800 11px var(--display); letter-spacing:.08em; text-transform:uppercase; padding:1px 8px; margin:0 4px 4px 0; border:2px solid var(--ink);
  background:repeating-linear-gradient(135deg,var(--y) 0 7px,var(--ink) 7px 9px); }
.hazard span { background:var(--y); padding:0 3px; }

/* decision */
.act { font:900 clamp(30px,4vw,48px)/.9 var(--display); text-transform:uppercase; letter-spacing:-.02em; display:inline-block; border:4px solid var(--o); color:var(--o); padding:4px 12px 2px; transform:rotate(-2.2deg); margin:2px 0 10px; mix-blend-mode:multiply; }
.pips { display:inline-flex; gap:3px; vertical-align:middle; } .pips i { width:14px; height:20px; border:2px solid var(--ink); } .pips i.on { background:var(--o); }
.bar { margin:7px 0; } .bar .lab { display:flex; justify-content:space-between; font:12px var(--mono); }
.bar .tr { height:20px; border:2px solid var(--ink); background:var(--paper); } .bar .fl { height:100%; background:var(--c,var(--t)); width:0; transition:width .7s cubic-bezier(.2,.9,.2,1); mix-blend-mode:multiply; }
.bar:first-of-type .fl { background:var(--o); }
.chip { display:inline-block; font:11px var(--mono); border:1.5px solid var(--ink); padding:0 6px; margin:0 4px 4px 0; background:var(--paper); }

/* approval seats */
.seats { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 12px; }
.seat { width:128px; border:2px dashed var(--ink); padding:8px; text-align:center; min-height:84px; }
.seat.full { border-style:solid; background:var(--c); }
.seat b { display:block; font:800 12px var(--display); text-transform:uppercase; letter-spacing:.05em; }
.seat .v { display:block; font:900 22px/1.1 var(--display); text-transform:uppercase; transform:rotate(-4deg); margin-top:6px; }
textarea { width:100%; border:2px solid var(--ink); background:var(--paper); padding:6px; resize:vertical; }
.votes { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

/* audit ribbon */
.ribbon { display:flex; flex-wrap:wrap; gap:0; margin:4px 0 8px; }
.bead { --c:var(--t); width:22px; height:30px; border:2px solid var(--ink); margin-right:-2px; background:var(--paper); cursor:pointer; transition:background .15s,transform .15s; position:relative; }
.bead.on { background:var(--c); } .bead.now { transform:translateY(-5px); z-index:2; box-shadow:3px 3px 0 var(--ink); }
.bead:hover { transform:translateY(-5px); z-index:2; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; font:800 11px var(--display); letter-spacing:.1em; text-transform:uppercase; border-bottom:3px solid var(--ink); padding:3px 6px; }
td { padding:3px 6px; border-bottom:1px dashed #17120f66; vertical-align:top; }
.scroll { max-height:340px; overflow:auto; }
.empty { padding:50px 20px; text-align:center; font:900 clamp(26px,4vw,44px)/1 var(--display); text-transform:uppercase; color:var(--ink); }
.empty span { color:var(--o); mix-blend-mode:multiply; } .empty i { font-style:normal; color:var(--t); mix-blend-mode:multiply; }
.passage { border:2px solid var(--ink); background:var(--paper); padding:10px; margin-bottom:10px; white-space:pre-wrap; }
.ask { display:flex; gap:8px; } .ask input { flex:1; border:2px solid var(--ink); background:var(--paper); padding:8px; }
/* auditor lab */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
.stat { --c:var(--t); border:2px solid var(--ink); background:var(--card); padding:10px 12px; box-shadow:5px 5px 0 var(--c); }
.stat b { display:block; font:900 clamp(34px,4vw,52px)/.95 var(--display); color:var(--c); -webkit-text-stroke:1.5px var(--ink); }
.stat span { font:800 12px var(--display); letter-spacing:.1em; text-transform:uppercase; }
.stat small { display:block; font-size:11px; color:var(--mute); }
.matrix { display:grid; gap:8px; }
.mrow { --c:var(--t); display:grid; grid-template-columns:150px 1fr 48px; gap:10px; align-items:center; }
.mname { font:800 12px var(--display); letter-spacing:.08em; text-transform:uppercase; border-left:10px solid var(--c); padding-left:8px; }
.tiles { display:flex; flex-wrap:wrap; gap:4px; }
.tile { width:24px; height:24px; border:2px solid var(--ink); background:var(--paper); cursor:pointer; padding:0; transition:transform .1s; }
.tile.pass { background:var(--t); } .tile.fail { background:var(--p); } .tile:hover { transform:translateY(-4px) rotate(-4deg); box-shadow:3px 3px 0 var(--ink); }
.appform { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin:10px 0; } .fld { display:flex; flex-direction:column; gap:3px; font:700 12px var(--display); letter-spacing:.04em; text-transform:uppercase; }
.fld input, .fld select { border:2px solid var(--ink); background:var(--paper); padding:6px; font:14px var(--mono); text-transform:none; }
.labrow { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; } .labrow select, .labrow input { flex:1; min-width:120px; border:2px solid var(--ink); background:var(--paper); padding:6px; }
.kv { display:grid; grid-template-columns:150px 1fr; gap:4px 12px; margin:6px 0 10px; } .kv dt { font:800 11px var(--display); letter-spacing:.1em; text-transform:uppercase; padding-top:2px; } .kv dd { margin:0; }
.spark { display:flex; align-items:flex-end; gap:2px; height:90px; border-bottom:3px solid var(--ink); margin-top:6px; }
.spark i { flex:1; min-width:3px; background:var(--ink); } .spark i.credit { background:var(--t); } .spark i.abroad { background:var(--p); } .spark i.alert { outline:3px solid var(--o); background:var(--o); }
.chip.yes { background:var(--t); } .chip.no { background:var(--p); }
.checks { list-style:none; padding:0; margin:8px 0; font:13px var(--mono); } .checks .okc { color:#0b6b66; } .checks .badc { color:#a3125b; font-weight:700; }
@media print {
  .mast, .ticker, .tabs, #rail, #msg, .ctl, .votes, .btn, .labrow { display:none !important; }
  body { background:#fff; } main { display:block; padding:0; border:0; } .card { box-shadow:none; break-inside:avoid; }
  .node { filter:none; } .scroll { max-height:none; overflow:visible; }
}
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="mast">
  <div class="word" aria-label="NEXA"><span class="a">NE</span><span class="b">XA</span></div>
  <div class="tag">Agents <b>recommend</b><br>Code <b>enforces</b><br>Humans <b>authorize</b></div>
  <div class="plug"><input id="token" type="password" placeholder="paste bearer token" autocomplete="off" aria-label="Bearer token">
    <button class="btn" id="connect">Plug in</button></div>
  <span id="who" class="stamp"></span>
</header>
<div class="ticker" aria-hidden="true"><div id="tick"></div></div>
<div id="msg" role="status"></div>
<nav class="tabs" id="tabs"></nav>
<main>
  <section id="rail"></section>
  <section id="stage"></section>
</main>
<script>
// Every value from the API goes in as a text node, never as HTML.
const $ = id => document.getElementById(id);
const h = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids.filter(k => k != null)); return e; };
const INKS = ["--t", "--b", "--y", "--o", "--p"];
const S = { feedTimer: 0, token: sessionStorage.getItem("nexa_token") || "", mode: "", tab: "cases", scenarios: [], sel: 0, cases: [], pending: [],
  view: null, audit: [], upto: 0, pick: null, timer: null, ui: {} };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { Authorization: "Bearer " + S.token, "Content-Type": "application/json" } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(typeof body.detail === "string" ? body.detail : r.status + " " + r.statusText), { status: r.status });
  return body;
}
function note(text) { $("msg").textContent = text || ""; $("msg").className = text ? "show" : ""; }
const guard = fn => async (...a) => { try { note(""); await fn(...a); } catch (e) { note("✖ " + e.message); } };
const kind = s => /execut|approved|decision_ready|completed|verified/.test(s) ? "ok" : /fail|reject|expire|escalat/.test(s) ? "bad" : "wait";
const pretty = s => String(s).replaceAll("_", " ");
const stamp = s => h("span", "st " + kind(s), pretty(s));

/* ---------- the agent relay: each stage lights when an audit event proves it happened ---------- */
const STAGES = [
  ["Data agent", "reads the bank via tools", "--t", e => e.actor.includes("data_agent")],
  ["Analysis agent", "turns facts into typed findings", "--b", e => e.actor.includes("analysis_agent")],
  ["Policy agent", "cites the rulebook", "--y", e => e.actor.includes("policy_agent")],
  ["Verifier", "checks agents against facts", "--p", e => /executing->verifying/.test(e.detail)],
  ["Decision", "recommends, never acts", "--o", e => e.event_type === "decision_made"],
  ["Gate", "plain code, not a prompt", "--t", e => e.event_type === "approval_requested"],
  ["Humans", "vote with their own role", "--y", e => e.event_type === "approval_vote_cast"],
  ["Executor", "acts only on an approved id", "--o", e => e.event_type === "action_executed"],
  ["Closed", "verified and sealed", "--p", e => /->completed$/.test(e.detail)],
].map(([label, sub, ink, test]) => ({ label, sub, ink, test }));

function paint() {
  const { audit, upto } = S, u = S.ui; if (!u.nodes) return;
  const done = upto >= audit.length, shown = audit.slice(0, upto), last = shown[shown.length - 1];
  let now = -1;
  STAGES.forEach((s, i) => {
    const lit = shown.some(s.test), n = u.nodes[i];
    n.classList.toggle("lit", lit);
    n.classList.toggle("skip", done && !S.view.approval && i > 4);
    n.classList.toggle("pick", S.pick === i);
    if (last && s.test(last)) now = i;
  });
  u.nodes.forEach((n, i) => n.classList.toggle("now", i === now && !done));
  u.beads.forEach((b, i) => { b.classList.toggle("on", i < upto); b.classList.toggle("now", i === upto - 1 && !done); });
  u.range.max = audit.length; u.range.value = upto;
  u.read.textContent = last ? `${last.timestamp.slice(11, 19)}  ${last.event_type}  ${last.actor}  ${last.detail}` : "tape rewound";
}
function play(from = 0) {
  clearInterval(S.timer); S.upto = REDUCED ? S.audit.length : from; paint();
  if (REDUCED) return;
  S.timer = setInterval(() => { if (S.upto >= S.audit.length) return clearInterval(S.timer); S.upto++; paint(); }, 85);
}

/* ---------- cases ---------- */
async function refresh() {
  S.cases = await api("/cases"); S.pending = (await api("/approvals/pending")).map(v => ({ id: v.id, status: v.status, recommended_action: v.decision?.recommended_action }));
  const waiting = S.pending.length, parts = [`${S.cases.length} cases on the books`, `${waiting} waiting on humans`, "every action is audited", "agents never touch the bank directly", "recommendations are not probabilities", "synthetic data only"];
  const text = parts.join("  ✶  ").toUpperCase() + "  ✶  ";
  $("tick").replaceChildren(...[0, 1].map(() => h("span", "", text)));
  drawRail();
}
function caseList(items, empty) {
  if (!items.length) return h("div", "mute", empty);
  const box = h("div");
  items.forEach(c => { const r = h("div", "row" + (S.view?.id === c.id ? " sel" : ""), stamp(c.status), h("span", "id", c.id.replace("case_", "")), c.recommended_action ? h("span", "mute mono", pretty(c.recommended_action)) : null);
    r.onclick = guard(() => show(c.id)); box.append(r); });
  return box;
}
function drawRail() {
  const rail = $("rail"); rail.replaceChildren();
  if (S.mode !== "employee") return;
  const sc = S.scenarios[S.sel], deck = h("div", "carts");
  S.scenarios.forEach((s, i) => { const b = h("button", "cart" + (i === S.sel ? " on" : ""), h("b", "", String.fromCharCode(65 + i)), s.title);
    b.style.setProperty("--c", `var(${INKS[i % 5]})`); b.onclick = () => { S.sel = i; drawRail(); }; deck.append(b); });
  const run = h("button", "btn", "Run investigation"); run.onclick = guard(async () => {
    const { id, title, description, ...alert } = sc; run.disabled = true;
    try { await show((await api("/cases", { method: "POST", body: JSON.stringify(alert) })).id, 0); } finally { run.disabled = false; } });
  rail.append(
    h("div", "card", h("h2", "", "Load a scenario"), deck, h("div", "", h("b", "", sc.title)), h("p", "mute", sc.description), run),
    Object.assign(h("div", "card", h("h2", "", "Waiting on humans"), caseList(S.pending, "Nobody is waiting.")), { style: "--c:var(--t)" }),
    Object.assign(h("div", "card", h("h2", "", "All cases"), caseList(S.cases, "No cases yet. Load a scenario.")), { style: "--c:var(--b)" }));
}

function card(title, ink, ...kids) { const c = h("div", "card", h("h2", "", title), ...kids); c.style.setProperty("--c", `var(${ink})`); return c; }
function table(head, rows) { const t = h("table"); t.append(h("tr", "", ...head.map(x => h("th", "", x)))); rows.forEach(r => t.append(h("tr", "", ...r.map(x => x instanceof Node ? x : h("td", "", x))))); return t; }

async function show(id, from) {
  const [v, audit] = await Promise.all([api("/cases/" + encodeURIComponent(id)), api("/cases/" + encodeURIComponent(id) + "/audit")]);
  const prev = S.view?.id === id ? S.audit.length : audit.length;
  S.view = v; S.audit = audit; S.pick = null; build();
  from === undefined ? (S.upto = audit.length, paint()) : play(from === "resume" ? prev : from);
  await refresh();
}
function build(lead = []) {

      ...kv("Address", p.address_on_file, mismatch ? h("span", "hazard", h("span", "", "document says: " + p.address_on_document)) : null),
      ...kv("Travel notices", p.travel_notices.join("; ") || "none"), ...kv("Countries seen", p.countries.join(", ")),
      ...kv("History", `${p.payments} movements · average payment ${money(p.average_debit)}`)),
    h("div", "mono mute", "last 40 movements, height = amount (ink = debit, teal = credit, pink = abroad, orange outline = the flagged one)"), bars);
}
function verdictCard(r) {
  const c = r.case, s = c.score, e = c.expected, chips = (xs, cls) => xs.map(x => h("span", "chip " + (cls || ""), pretty(x)));
  const out = card(`Verdict · ${c.title}`, s ? (s.passed ? "--t" : "--p") : "--y");
  out.append(h("div", "", h("span", "st " + (s ? (s.passed ? "ok" : "bad") : ""), s ? (s.passed ? "pass" : "fail") : "not run"), " ", h("span", "mono mute", `${pretty(c.archetype)} · ${c.id}`)), h("p", "", c.description));
  out.append(h("dl", "kv", h("dt", "", "Label accepts"), h("dd", "", ...chips(e.acceptable_actions)), h("dt", "", "Label forbids"), h("dd", "", ...chips(e.forbidden_actions, "no")),
    h("dt", "", "Needs a human"), h("dd", "", e.must_involve_human ? "yes" : "no"),
    ...(s ? [h("dt", "", "System recommended"), h("dd", "", h("span", "chip " + (s.useful ? "yes" : "no"), pretty(s.action || "nothing")), ` · risk level ${s.risk_level ?? "–"} · ${s.human_involved ? "human involved" : "no human"}${s.gate ? " · gate: " + pretty(s.gate) : ""}`),
      h("dt", "", "Took"), h("dd", "", s.duration_ms + " ms")] : [])));
  if (s) out.append(h("ul", "checks", ...s.checks.map(k => h("li", k.ok ? "okc" : "badc", (k.ok ? "✓ " : "✗ ") + k.name + (k.ok || !k.detail ? "" : " — " + k.detail))),
    h("li", s.useful ? "okc" : "badc", (s.useful ? "✓ " : "✗ ") + "chose an accepted action")));
  const bar = h("div", "labrow"), go = h("button", "btn", s ? "Run again and replay" : "Run this case");
  go.onclick = guard(async () => { await runCases([c.id], c.title); await showReport(c.id, true); }); bar.append(go);
  if (s) { const x = h("button", "btn alt", "Export JSON"), pr = h("button", "btn alt", "Print report"); x.onclick = () => download(`${c.id}.json`, r); pr.onclick = () => window.print(); bar.append(x, pr); }
  out.append(bar); return out;
}
async function showReport(id, animate) {
  const r = await api("/admin/lab/cases/" + encodeURIComponent(id));
  S.report = r; S.view = r.run; S.audit = r.audit; S.pick = null; S.ui = {};
  const lead = [verdictCard(r), accountCard(r.account)];
  if (!r.run) return $("stage").replaceChildren(...lead);
  build(lead);
  animate ? play(0) : (S.upto = r.audit.length, paint());
  window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
}

/* ---------- capability: baselines, hostile models, the hard tier, a real model ---------- */
function meter(n, total, ink, label) {
  const fill = h("div"); fill.style.cssText = `height:100%;width:0;background:var(--${ink});mix-blend-mode:multiply;transition:width .8s cubic-bezier(.2,.9,.2,1)`;
  requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = (total ? 100 * n / total : 0) + "%"));
  const tr = h("div", "tr"); tr.style.cssText = "height:22px;border:3px solid #17120f;background:#efe5cd;min-width:140px;flex:1"; tr.append(fill);
  const w = h("div"); w.style.cssText = "display:flex;align-items:center;gap:8px"; w.append(tr, h("b", "mono", label ?? `${n}`)); return w;
}
async function drawCapability() {
  const st = $("stage"); st.replaceChildren(card("Capability", "--o", h("div", "mono mute", "running the agents, the simple rules and the hostile models on every lab case...")));
  const base = await api("/admin/lab/baselines");   // runs every case first, so load the rest afterwards
  const [hostile, live] = await Promise.all([api("/admin/lab/hostile"), api("/admin/lab/live"), loadLab()]);
  st.replaceChildren();

  // 1. the agents against simple rules, on the same cases with the same checks
  const rows = base.map(r => { const k = r.card, you = r.key === "agents";
    const tr = h("tr", you ? "you" : "", h("td", "", h("b", "", r.title), h("div", "mono mute", r.description)),
      h("td", "", meter(k.passed, k.total, "t", pct(k.passed, k.total))), h("td", "", meter(k.preferred, k.total, "b", pct(k.preferred, k.total))),
      h("td", "", `${k.over_escalated}`), h("td", "", pct(k.human_routed, k.total)), h("td", k.unjustified ? "badc" : "", `${k.unjustified}`));
    if (you) tr.style.background = "#ffc92855"; return tr; });
  const t = h("table"); t.append(h("tr", "", ...["Decision maker", "Passed", "Preferred action", "Over-escalated", "Sent to humans", "Unjustified restrictions"].map(x => h("th", "", x))), ...rows);
  st.append(card("1 · The agents against simple rules", "--t", h("p", "", "Same 98 cases, same checks. Five rules from “do nothing” to a typical multi-signal risk score. None of them cites a finding or a policy, so a restriction from a rule counts as unjustified."), t,
    h("p", "mono mute", "Passed = safe and an action the label accepts. Preferred = the action the label lists first (labels accept several, and “escalate” is acceptable almost everywhere, so passing alone flatters a system that escalates everything). Over-escalated = escalated where the label did not need a human."),
    h("p", "mono mute", "Fairness: the agents' thresholds were tuned on the original scenarios; the rules were not tuned at all.")));

  // 2. hostile models behind the real gates
  const hrows = hostile.map(m => h("tr", "", h("td", "", h("b", "", m.title), h("div", "mono mute", m.description)),
    h("td", "", meter(m.raw_unsafe, m.total, "p", `${m.raw_unsafe} of ${m.total}`)), h("td", "", meter(m.total - m.safe, m.total, "p", `${m.total - m.safe} of ${m.total}`)),
    h("td", "", `${m.gate_interventions}`), h("td", "", `${m.fallbacks}`)));
  const ht = h("table"); ht.append(h("tr", "", ...["Stand-in model", "Unsafe if accepted", "Unsafe after the gates", "Gates stepped in", "Rules took over"].map(x => h("th", "", x))), ...hrows);
  st.append(card("2 · Hostile models cannot get past the gates", "--p", h("p", "", "Each model misbehaves on purpose behind the real decision provider. “Unsafe if accepted” counts proposals that break the label (a forbidden action, or no human where one is needed). The right-hand bar is what actually came out."), ht,
    h("p", "mono mute", "A model proposes and plain code decides, so even a reckless or lazy model produces no unsafe recommendation. That is the claim, shown on every lab case.")));

  // 3. the hard tier: where the system's answer differs from the preferred one
  const hard = S.lab.filter(c => c.archetype === "hard" && c.score);
  const hr = hard.map(c => { const pref = c.expected.acceptable_actions[0], ok = c.score.preferred;
    return h("tr", "", h("td", "", c.title), h("td", "", pretty(pref)), h("td", ok ? "okc" : "badc", pretty(c.score.action)), h("td", c.score.passed ? "okc" : "badc", c.score.passed ? "pass" : "fail"), h("td", "", ok ? "yes" : "no")); });
  const dt = h("table"); dt.append(h("tr", "", ...["Case", "Preferred", "Got", "Accepted?", "Matches preferred"].map(x => h("th", "", x))), ...hr);
  const hp = hard.filter(c => c.score.passed).length, hm = hard.filter(c => c.score.preferred).length;
  st.append(card("3 · The hard tier", "--y", h("p", "", `${hard.length} realistic stories written without tuning the thresholds to them, some of them known blind spots. ${hp} of ${hard.length} are accepted; ${hm} of ${hard.length} match the preferred action.`), dt,
    h("p", "mono mute", "Labels were fixed before the first run. The gap between accepted and preferred is where the system is cautious (it escalates where watching would do), or where the policy has no rule (cash-out after salary).")));

  // 4. a real model behind the same gates
  const lv = live;
  st.append(card("4 · A real model against the rules", "--b", lv.available
    ? h("div", "", h("div", "stats", stat("agree with rules", pct(lv.agree, lv.total), `${lv.agree} of ${lv.total}`, "--t"), stat("safe", pct(lv.safe, lv.total), "after the gates", "--b"), stat("preferred", pct(lv.preferred, lv.total), `${lv.preferred} of ${lv.total}`, "--y"),
        stat("gates overruled it", String(lv.gate_interventions), "cases", "--p"), stat("rules took over", String(lv.fallbacks), "model down or invalid", "--o")),
      h("p", "mono mute", `${lv.provider} · ${lv.total} cases · ${lv.seconds} s · saved ${lv.saved_at}. A real model proposed; the same hard gates decided; the rules took over when it failed.`))
    : h("div", "", h("p", "", "No live run saved yet. In a terminal, from the project folder:"), h("p", "mono", "python -u scripts/run_lab_live.py"), h("p", "mono mute", "It needs a Groq or Gemini key in .env, takes a while on a free tier, and saves its result here."))));
}

function empty() { $("stage").replaceChildren(h("div", "card empty", "Load a ", h("span", "", "scenario"), h("br"), "watch the ", h("i", "", "agents"), " work")); }

$("connect").onclick = guard(async () => {
  S.token = $("token").value.trim(); sessionStorage.setItem("nexa_token", S.token);
  try { S.scenarios = await api("/scenarios"); S.mode = "employee"; }
  catch (e) {
    if (e.status !== 403) throw e;   // a valid token without case access is an auditor or a customer
    try { await api("/admin/lab/scorecard"); S.mode = "auditor"; } catch (e2) { if (e2.status !== 403) throw e2; S.mode = "customer"; }
  }
  S.tab = { employee: "cases", auditor: "lab", customer: "app" }[S.mode]; S.view = null; $("who").textContent = S.mode; drawTabs();
  if (S.mode === "customer") return drawApp();
  if (S.mode === "auditor") return openTab("lab");
  empty(); await refresh(); note("");
});
$("token").value = S.token; if (S.token) $("connect").onclick();
$("tick").textContent = "AGENTS RECOMMEND  ✶  CODE ENFORCES  ✶  HUMANS AUTHORIZE  ✶  ";
</script>
