name: no-attribution-trailers
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Reject Co-Authored-By trailers
        run: |
          if git log --format=%B origin/${{ github.base_ref }}..HEAD | grep -qi '^co-authored-by:'; then
            echo "Remove Co-Authored-By trailers from the commits in this PR."; exit 1
          fi
