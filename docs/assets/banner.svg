<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">NexaBank Agentic Platform</title>
  <desc id="d">Agents recommend, code enforces, humans authorize.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#1a1458"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9cff"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9cff"/>
      <stop offset="0.55" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="26" fill="url(#glow)"/>

  <!-- quiet network pattern on the right -->
  <g stroke="#7aa7ff" stroke-opacity="0.22" stroke-width="2" fill="none">
    <polyline points="900,60 990,120 1090,70 1180,140 1240,90"/>
    <polyline points="940,250 1030,200 1120,260 1210,210"/>
    <line x1="990" y1="120" x2="1030" y2="200"/>
    <line x1="1090" y1="70" x2="1120" y2="260"/>
    <line x1="1180" y1="140" x2="1210" y2="210"/>
  </g>
  <g fill="#9ec1ff" fill-opacity="0.55">
    <circle cx="900" cy="60" r="7"/><circle cx="990" cy="120" r="9"/><circle cx="1090" cy="70" r="7"/>
    <circle cx="1180" cy="140" r="9"/><circle cx="1240" cy="90" r="6"/>
    <circle cx="940" cy="250" r="6"/><circle cx="1030" cy="200" r="8"/>
    <circle cx="1120" cy="260" r="7"/><circle cx="1210" cy="210" r="6"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(150 150) scale(0.62)">
    <path d="M0,-108 L92,-72 V16 C92,70 42,106 0,126 C-42,106 -92,70 -92,16 V-72 Z" fill="url(#shield)"/>
    <path d="M0,-108 L92,-72 V16 C92,70 42,106 0,126 C-42,106 -92,70 -92,16 V-72 Z" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" fill="none">
      <line x1="-46" y1="-40" x2="0" y2="-56"/><line x1="46" y1="-40" x2="0" y2="-56"/>
      <line x1="-46" y1="-40" x2="-52" y2="10"/><line x1="46" y1="-40" x2="52" y2="10"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.85">
      <circle cx="0" cy="-56" r="9"/><circle cx="-46" cy="-40" r="8"/><circle cx="46" cy="-40" r="8"/>
      <circle cx="-52" cy="10" r="8"/><circle cx="52" cy="10" r="8"/>
    </g>
    <path d="M-34,14 L-10,40 L38,-14" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="270" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">NexaBank Agentic Platform</text>
  <rect x="272" y="146" width="420" height="6" rx="3" fill="url(#accent)"/>
  <text x="270" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#c7d2fe">AI agents that investigate. Deterministic code that decides what is allowed.</text>
  <text x="270" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#c7d2fe">Humans who authorize.</text>

  <!-- three pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <rect x="270" y="262" width="214" height="38" rx="19" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="377" y="287" fill="#bfdbfe">AGENTS RECOMMEND</text>
    <rect x="500" y="262" width="194" height="38" rx="19" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5"/>
    <text x="597" y="287" fill="#a7f3d0">CODE ENFORCES</text>
    <rect x="710" y="262" width="214" height="38" rx="19" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="817" y="287" fill="#fde68a">HUMANS AUTHORIZE</text>
  </g>
</svg>
