<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
  <title id="t">Key numbers</title>
  <desc id="d">713 tests, 11 scenarios, 4 specialist agents, 92.5 percent retrieval recall at 3, 10 decision records, 2 roles for Level 4.</desc>
  <defs>
    <linearGradient id="n1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="n2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="n3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="n4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#be185d"/></linearGradient>
    <linearGradient id="n5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="n6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <rect x="4" y="6" width="186" height="138" rx="18" fill="url(#n1)"/>
    <text x="97" y="76" font-size="50" font-weight="800">713</text>
    <text x="97" y="108" font-size="16" font-weight="600">tests passing</text>

    <rect x="204" y="6" width="186" height="138" rx="18" fill="url(#n2)"/>
    <text x="297" y="76" font-size="50" font-weight="800">11</text>
    <text x="297" y="108" font-size="16" font-weight="600">scenarios, all safe</text>

    <rect x="404" y="6" width="186" height="138" rx="18" fill="url(#n3)"/>
    <text x="497" y="76" font-size="50" font-weight="800">4</text>
    <text x="497" y="108" font-size="16" font-weight="600">specialist agents</text>

    <rect x="604" y="6" width="186" height="138" rx="18" fill="url(#n4)"/>
    <text x="697" y="76" font-size="50" font-weight="800">92.5%</text>
    <text x="697" y="108" font-size="16" font-weight="600">retrieval recall@3</text>

    <rect x="804" y="6" width="186" height="138" rx="18" fill="url(#n5)"/>
    <text x="897" y="76" font-size="50" font-weight="800">10</text>
    <text x="897" y="108" font-size="16" font-weight="600">decision records</text>

    <rect x="1004" y="6" width="190" height="138" rx="18" fill="url(#n6)"/>
    <text x="1099" y="76" font-size="50" font-weight="800">2</text>
    <text x="1099" y="108" font-size="16" font-weight="600">roles to freeze</text>
  </g>
</svg>
